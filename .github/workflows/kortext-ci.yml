name: Kortext CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && npm --prefix ui ci

      - name: Typecheck (server + panel)
        run: npm run typecheck

      - name: Test (node:test)
        run: npm test

      - name: Build (server + panel)
        run: npm run build

      # Sanity smoke: the compiled entry must load on a clean machine.
      - name: Smoke (compiled CLI help)
        run: node dist/index.js --help
