name: Kortext
options:
  bundleIdPrefix: com.milowda
  deploymentTarget:
    macOS: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.7.0
targets:
  Kortext:
    type: application
    platform: macOS
    sources: [Kortext]
    dependencies:
      - package: Sparkle
    info:
      path: Kortext/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Kortext
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://raw.githubusercontent.com/erayendes/kortext/main/macos/appcast.xml
        SUPublicEDKey: CE3Cn6zbYOA36WztPK3V0R7+8dqSCvn2lFbKSe255mA=
        SUEnableAutomaticChecks: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.milowda.kortext
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
